<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Only Kashmir Tours and Travels</title>
  <script>
    // Single Page Application redirect for GitHub Pages
    // This preserves the path so React Router can handle client-side routing
    var path = window.location.pathname;
    var hash = window.location.hash;
    var redirectUrl = '/' + '?p=' + path.substring(1) + hash;
    window.location.replace(redirectUrl);
  </script>
</head>

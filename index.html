 Lake are must-visit attractions. Gulmarg Gondola tickets cover Phase 1 to Kongdori and Phase 2 to Affarwat.`,bestTime:"Best time to visit Gulmarg: December-March for snow and skiing, April-September for green meadows and flowers.",duration:"3-4 Days",activities:["Skiing & Snowboarding","Gulmarg Gondola Ride (Phase 1 & 2)","Trekking to Alpather Lake","Golfing at the highest green golf course","Sleigh rides in winter"],gallery:["https://images.unsplash.com/photo-1707045189683-4cced7a3a6b3?auto=format&w=1200&q=80","https://images.unsplash.com/photo-1626017088971-6a2a5f0d8c97?w=800&q=80","https://images.unsplash.com/photo-1626017088971-6a2a5f0d8c97?w=800&q=80"]},pahalgam:{name:"Pahalgam",tagline:"Valley of Shepherds & Sightseeing",image:"https://images.unsplash.com/photo-1564509180796-129e4f4f6de9?auto=format&fit=crop&w=1200&q=80",desc:"Pahalgam sightseeing guide: Betaab Valley, Aru Valley & more!",rating:"4.8",highlight:"Sightseeing Hub",fullDesc:"Pahalgam is a serene valley located in the Anantnag district of Kashmir. Surrounded by snow-capped mountains and lush green forests, it is a perfect destination for nature lovers. The Lidder River flows through the valley, adding to its charm. Pahalgam serves as the base camp for the annual Amarnath Yatra pilgrimage. Top Pahalgam sightseeing places include Betaab Valley, Aru Valley, Chandanwari, and the Baisaran meadows.",bestTime:"April to October",duration:"3-4 Days",activities:["Pahalgam Sightseeing: Betaab Valley","River Rafting on Lidder River","Trekking to Tarsar Lake","Horse Riding in Baisaran","Visit Aru Valley","Visit Chandanwari","Camping by the riverside"],gallery:["https://images.unsplash.com/photo-1600702653377-2bbad1049612?w=800&q=80","https://images.unsplash.com/photo-1595815771614-ade9d652a65d?w=800&q=80","https://images.unsplash.com/photo-1581791534721-e599df4417f6?w=800&q=80"]},sonmarg:{name:"Sonamarg",tagline:"Meadow of Gold & Day Trip",image:"https://images.unsplash.com/photo-1609766857041-ed402ea8069a?w=1200&q=80",desc:"Sonamarg day trip from Srinagar is perfect! Visit Thajiwas Glacier.",rating:"4.9",highlight:"Day Trip Destination",fullDesc:'Sonamarg, meaning "Meadow of Gold", is a picturesque hill station located on the banks of the Sindh River. A Sonamarg day trip from Srinagar is perfect! Surrounded by towering glaciers and snow-capped peaks, it serves as the gateway to Ladakh. The Thajiwas Glacier is a major attraction, accessible by pony ride. Adventure enthusiasts can enjoy trekking to Vishansar Lake, white-water rafting, and camping under the stars.',bestTime:"May to September",duration:"2-3 Days or Sonamarg day trip",activities:["Sonamarg Day Trip from Srinagar","Visit Thajiwas Glacier","Trekking to Vishansar & Krishansar Lakes","White Water Rafting","Camping","Pony Rides"],gallery:["https://images.unsplash.com/photo-1609766857041-ed402ea8069a?w=800&q=80","https://images.unsplash.com/photo-1537126694932-c0f39026528e?w=800&q=80","https://images.unsplash.com/photo-1581791534721-e599df4417f6?w=800&q=80"]},"dal-lake":{name:"Dal Lake",tagline:"Jewel of Srinagar & Houseboats",image:"https://images.unsplash.com/photo-1597074866923-dc0589150bf6?w=1200&q=80",desc:"Dal Lake Srinagar - Book houseboats, enjoy Shikara rides!",rating:"4.9",highlight:"Houseboat Booking",fullDesc:`Dal Lake is the heart and soul of Srinagar, often referred to as the "Jewel in the Crown of Kashmir". We offer Srinagar houseboat booking for all budgets! The lake is famous for its traditional houseboats, colorful Shikaras, and floating vegetable gardens. A stay on a houseboat offers a unique experience of Kashmiri hospitality. The Mughal Gardens on the banks, including Shalimar Bagh and Nishant Bagh, add to the lake's charm.`,bestTime:"April to October",duration:"2-3 Days",activities:["Dal Lake Shikara Ride at Sunrise","Srinagar Houseboat Booking","Stay in a Traditional Houseboat","Visit Floating Market","Explore Mughal Gardens","Photography at Dawn"],gallery:["https://images.unsplash.com/photo-1597074866923-dc0589150bf6?w=800&q=80","https://images.unsplash.com/photo-1595815771614-ade9d652a65d?w=800&q=80","https://images.unsplash.com/photo-1600702653377-2bbad1049612?w=800&q=80"]},"leh-ladakh":{name:"Leh Ladakh",tagline:"Land of High Passes",image:"https://images.unsplash.com/photo-1632979720170-9a1ab1b103d3?auto=format&fit=crop&w=1200&q=80",desc:"Breathtaking moonscapes, ancient monasteries, and the highest motorable passes.",rating:"5.0",highlight:"Adventure Hub",fullDesc:"Leh Ladakh is a high-altitude desert region known for its dramatic landscapes, ancient Buddhist monasteries, and thrilling adventure opportunities. The region boasts some of the world's highest motorable passes including Khardung La and Chang La. Highlights include Pangong Tso Lake, Nubra Valley, Hemis Monastery, and the Magnetic Hill. It's a paradise for bikers, trekkers, and photography enthusiasts.",bestTime:"June to September",duration:"5-7 Days",activities:["Visit Pangong Tso Lake","Explore Nubra Valley","Monastery Tours (Hemis, Thiksey, Diskit)","Motorbike Expedition","River Rafting on Indus"],gallery:["https://images.unsplash.com/photo-1537126694932-c0f39026528e?w=800&q=80","https://images.unsplash.com/photo-1581791534721-e599df4417f6?w=800&q=80","https://images.unsplash.com/photo-1609766857041-ed402ea8069a?w=800&q=80"]},srinagar:{name:"Srinagar",tagline:"City of Gardens",image:"https://images.unsplash.com/photo-1595815771614-ade9d652a65d?w=1200&q=80",desc:"Mughal gardens, historic old city, and the famous handicraft bazaars.",rating:"4.7",highlight:"Heritage City",fullDesc:"Srinagar, the summer capital of Jammu and Kashmir, is a city of timeless beauty nestled in the Kashmir Valley. Known for its Mughal Gardens, serene lakes, and intricate handicrafts, the city exudes old-world charm. The historic old city with its bustling bazaars offers exquisite Pashmina shawls, carpets, and papier-mâché items. Don't miss the iconic Jamia Masjid and Shankaracharya Temple.",bestTime:"March to November",duration:"3-4 Days",activities:["Explore Mughal Gardens","Shop at Lal Chowk Bazaar","Visit Jamia Masjid","Shankaracharya Temple","Try Kashmiri Cuisine"],gallery:["https://images.unsplash.com/photo-1595815771614-ade9d652a65d?w=800&q=80","https://images.unsplash.com/photo-1597074866923-dc0589150bf6?w=800&q=80","https://images.unsplash.com/photo-1600702653377-2bbad1049612?w=800&q=80"]},"manasbal-lake":{name:"Manasbal Lake",tagline:"Lotus Lake of Kashmir",image:"https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=1200&q=80",desc:"Serene freshwater lake famed for lotus blooms and mirrored mountain reflections.",rating:"4.7",highlight:"Hidden Gem",fullDesc:"Manasbal Lake, often called the 'Supreme Gem of Kashmir Lakes', sits north of Srinagar near Safapora. Its clear waters mirror the surrounding Zabarwan hills and apple orchards, while lotus flowers carpet the surface in summer. A calm alternative to Dal, it’s perfect for picnics, birdwatching, and quiet Shikara rides. The nearby Mughal-era Jharokha (Jaroka Bagh) and ancient ruins of Daroga Bagh add heritage charm.",bestTime:"May to October",duration:"1 Day",activities:["Shikara ride among lotus blooms","Birdwatching along the banks","Picnic by the Mughal Jharokha garden","Photography at sunrise and sunset","Combine with Wullar Lake or Nagin Valley visit"],gallery:["https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"]},"sinthon-top":{name:"Sinthon Top",tagline:"360° Panoramic Pass",image:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80",desc:"High-altitude mountain pass linking Kashmir and Kishtwar with sweeping Himalayan views.",rating:"4.6",highlight:"Scenic Drive",fullDesc:"Sinthon Top (also spelled Sinthan) sits around 12,500 ft on the Anantnag–Kishtwar road. The pass offers uninterrupted 360° views of Pir Panjal snowfields, hairpin bends popular with road-trippers, and meadows that stay snow-dusted much of the year. It is less commercialized, making it ideal for photography, quick hikes, and serene picnics above the clouds.",bestTime:"June to September (road accessible)",duration:"Day Trip",activities:["Scenic drive with hairpin bends","Snow play and short ridge walks","Photography at the viewpoint deck","Picnic on the meadows (carry trash back)","Combine with Daksum and Kokernag springs"],gallery:["https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=800&q=80"]},doodhpathri:{name:"Doodhpathri",tagline:"Valley of Milk",image:"https://images.unsplash.com/photo-1489515217757-5fd1be406fef?auto=format&fit=crop&w=1200&q=80",desc:"Alpine meadows with milky-white streams, pine forests, and crowd-free picnic spots.",rating:"4.7",highlight:"Alpine Meadow",fullDesc:"Doodhpathri, about 45 km from Srinagar, is a lush bowl-shaped meadow carpeted with wildflowers and dense pines. The Shaliganga stream froths white against smooth boulders—giving the valley its “milk” name. Cooler and less commercial than Gulmarg, it’s great for day picnics, pony rides, and slow walks along the river.",bestTime:"May to October",duration:"Day Trip",activities:["Riverside picnic by Shaliganga stream","Pony ride across the meadows","Short forest walks and photography","Tea and kulcha at local dhabas","Snow play in early spring/late autumn"],gallery:["https://images.unsplash.com/photo-1489515217757-5fd1be406fef?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"]},"drung-fall":{name:"Drung Waterfall",tagline:"Frozen Cascade",image:"https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1200&q=80",desc:"Dramatic waterfall near Tangmarg that freezes into icicles in winter.",rating:"4.6",highlight:"Winter Marvel",fullDesc:"Drung (Dron) Waterfall sits close to Tangmarg on the way to Gulmarg. In peak winter the cascade turns into a wall of icicles, while summer reveals a thundering flow surrounded by pine forests. It is an easy stop from the Srinagar–Gulmarg highway and pairs well with nearby trout farms and local dhabas.",bestTime:"December to February for frozen view; May to September for flow",duration:"Half Day",activities:["View the frozen waterfall and icicles","Short riverside walk and photography","Tea and kahwa at roadside stalls","Combine with Gulmarg or Tangmarg trout farm","Snow play in winter months"],gallery:["https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80"]},"mughal-gardens":{name:"Mughal Gardens (Srinagar)",tagline:"Nishat • Shalimar • Harwan • Pari Mahal • Cheshma Shahi",image:"https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1200&q=80",desc:"Terraced lawns, fountains, and Chinar-lined vistas along Dal Lake.",rating:"4.8",highlight:"Heritage Gardens",fullDesc:"Srinagar’s Mughal garden circuit strings together Nishat Bagh’s twelve terraces, the royal pavilions of Shalimar, the hillside amphitheater of Harwan, the hilltop viewpoint of Pari Mahal, and the freshwater spring of Cheshma Shahi. Built by the Mughals for leisure and lake views, these gardens showcase Persian-inspired layouts, cascading water channels, and grand Chinars.",bestTime:"April to October (Chinar colors peak in autumn)",duration:"1 Day",activities:["Sunset stroll in Nishat and Shalimar terraces","Panoramic Dal Lake view from Pari Mahal","Spring water tasting at Cheshma Shahi","Picnic on Harwan lawns","Photography of Chinar foliage in autumn"],gallery:["https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1489515217757-5fd1be406fef?auto=format&fit=crop&w=800&q=80"]},amarnath:{name:"Amarnath Cave",tagline:"Sacred Himalayan Yatra",image:"https://res.cloudinary.com/dveg0ai0n/image/upload/v1771496839/Journey_to_Shri_Amarnath_Cave_cxxqte.jpg",desc:"High-altitude pilgrimage to the naturally formed ice lingam in a Himalayan cave.",rating:"4.9",highlight:"Pilgrimage",fullDesc:"The Amarnath Yatra leads devotees to a Himalayan cave shrine where an ice stalagmite is revered as a Shiva lingam. Routes typically start from Pahalgam (via Chandanwari and Sheshnag) or Baltal for a shorter but steeper ascent. The trek offers dramatic glaciers, alpine lakes, and spiritual camaraderie, operating seasonally under strict permits and weather advisories.",bestTime:"Yatra window (typically July–August, subject to official schedule)",duration:"3–5 Days (trek)",activities:["Pilgrimage trek via Pahalgam or Baltal","Helicopter-assisted darshan (subject to permits)","Camping at Sheshnag or Panchtarni","Glacier and alpine lake views","Local langar seva and community kitchens"],gallery:["https://res.cloudinary.com/dveg0ai0n/image/upload/v1771496839/Journey_to_Shri_Amarnath_Cave_cxxqte.jpg","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=800&q=80"]}};function D2(){const{slug:n}=yx(),o=ti(),u=N.useContext(Da)||(()=>{}),c=n?M2[n]:null;if(!c)return r.jsx("div",{className:"min-h-screen text-gray-900 flex items-center justify-center",style:{backgroundColor:"#F7F3E9"},children:r.jsxs("div",{className:"text-center",children:[r.jsx("h1",{className:"text-4xl font-playfair font-bold mb-4",children:"Destination Not Found"}),r.jsx("button",{onClick:()=>o("/destinations"),className:"px-6 py-3 bg-vintage-500 hover:bg-vintage-600 rounded-xl font-semibold transition-all",children:"Back to Destinations"})]})});const d={"@context":"https://schema.org","@type":"Place",name:c.name,description:c.desc,image:c.image,publicAccess:!0},g={gulmarg:[{question:"What is the best time to visit Gulmarg?",answer:"The best time to visit Gulmarg is December-March for snow and skiing, April-September for green meadows and flowers."},{question:"How much does Gulmarg Gondola cost?",answer:"Gulmarg Gondola tickets: Phase 1 (Kongdori) costs around ₹800, Phase 2 (Affarwat) costs around ₹1000. We include Gondola assistance in our Gulmarg packages."}],pahalgam:[{question:"What are the top places to visit in Pahalgam?",answer:"Top Pahalgam sightseeing: Betaab Valley, Aru Valley, Chandanwari, Baisaran, and Lidder River rafting."},{question:"How far is Pahalgam from Srinagar?",answer:"Pahalgam is about 95km from Srinagar, taking approximately 3 hours by road."}],sonmarg:[{question:"Is Sonamarg a good day trip from Srinagar?",answer:"Yes! Sonamarg makes a perfect day trip from Srinagar (3 hours drive one way). Visit Thajiwas Glacier and enjoy the scenic drive."},{question:"What is special about Sonamarg?",answer:"Sonamarg, meaning 'Meadow of Gold', is known for Thajiwas Glacier, alpine meadows, and serves as the gateway to Ladakh."}],"manasbal-lake":[{question:"What is special about Manasbal Lake?",answer:"Manasbal Lake is known for its lotus flowers and clear waters. It's less crowded than Dal Lake and perfect for birdwatching and quiet Shikara rides."},{question:"How far is Manasbal Lake from Srinagar?",answer:"Manasbal Lake is about 30km from Srinagar, making it a perfect day trip destination."}],"sinthon-top":[{question:"What is the best time to visit Sinthon Top?",answer:"June to September is the best time to visit Sinthon Top when the road is accessible and weather is pleasant."},{question:"How high is Sinthon Top?",answer:"Sinthon Top is located at approximately 12,500 feet elevation, offering panoramic views of the Pir Panjal range."}],"mughal-gardens":[{question:"What are the famous Mughal Gardens in Srinagar?",answer:"The famous Mughal Gardens in Srinagar include Shalimar Bagh, Nishat Bagh, Chashma Shahi, Pari Mahal, and Harwan Garden."},{question:"What is the best time to visit Mughal Gardens?",answer:"April to October is the best time to visit Mughal Gardens. Autumn (September-October) is especially beautiful with Chinar tree colors."}],doodhpathri:[{question:"What is special about Doodhpathri?",answer:"Doodhpathri, meaning 'Valley of Milk', is named after the frothy white Shaliganga stream. It's less commercialized than other Kashmir destinations."},{question:"How far is Doodhpathri from Srinagar?",answer:"Doodhpathri is about 45km from Srinagar, making it a perfect day trip destination."}],"drung-fall":[{question:"When is the best time to visit Drung Waterfall?",answer:"December to February is the best time to see the frozen waterfall as icicles. May to September shows the waterfall in full flow."},{question:"How far is Drung Waterfall from Gulmarg?",answer:"Drung Waterfall is about 15km from Gulmarg, located near Tangmarg on the Srinagar-Gulmarg highway."}],"dal-lake":[{question:"How much does a houseboat stay cost on Dal Lake?",answer:"Houseboat prices vary from ₹2,000-₹10,000 per night depending on luxury level. We offer budget, premium, and luxury houseboat booking."},{question:"What is the best time for Dal Lake Shikara ride?",answer:"Early morning (6-8 AM) and sunset (5-7 PM) are the best times for Shikara rides to avoid crowds and enjoy stunning views."}],"leh-ladakh":[{question:"What is the best time to visit Leh Ladakh?",answer:"June to September is the best time to visit Leh Ladakh when roads are open and weather is pleasant."},{question:"How many days are needed for Leh Ladakh trip?",answer:"Minimum 5-7 days are recommended for Leh Ladakh to properly acclimatize and visit Pangong Lake, Nubra Valley, and local monasteries."}],srinagar:[{question:"What are the must-visit places in Srinagar?",answer:"Must-visit places in Srinagar: Dal Lake, Mughal Gardens (Shalimar, Nishat, Chashma Shahi), Shankaracharya Temple, and Lal Chowk market."},{question:"How many days are enough for Srinagar?",answer:"2-3 days are enough for Srinagar to cover the main attractions including Mughal Gardens, Dal Lake, and local sightseeing."}]}[n]||[];return r.jsxs("div",{className:"min-h-screen text-gray-900",style:{backgroundColor:"#F7F3E9"},children:[r.jsx(Sa,{title:`${c.name} - Best Time to Visit & Things to Do | Only Kashmir`,description:`Discover ${c.name} in Kashmir! Find the best time to visit, top things to do & plan your trip with Only Kashmir Travel Agency. ${c.desc}`,canonical:`https://www.onlykashmir.com/destinations/${n}`,ogImage:c.image,schema:d,faq:g}),r.jsxs("div",{className:"relative h-[50vh] sm:h-[60vh] overflow-hidden",children:[r.jsx("img",{src:c.image,alt:c.name,className:"h-full w-full object-cover"}),r.jsx("div",{className:"absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/50 to-transparent"}),r.jsxs("button",{onClick:()=>o("/destinations"),className:"absolute top-20 left-4 sm:left-8 flex items-center gap-2 px-4 py-2 bg-black/50 backdrop-blur-sm rounded-full border border-white/20 hover:bg-black/70 transition-all",children:[r.jsx(r1,{className:"h-5 w-5"}),r.jsx("span",{className:"hidden sm:inline",children:"Back"})]}),r.jsx("div",{className:"absolute bottom-0 left-0 right-0 p-6 sm:p-12",children:r.jsxs("div",{className:"container mx-auto",children:[r.jsxs("div",{className:"flex items-center gap-2 text-vintage-600 mb-3",children:[r.jsx(Dl,{className:"h-5 w-5"}),r.jsx("span",{className:"font-medium",     <script>
      // Redirect legacy hash routes and normalize GitHub Pages SPA behavior
      (function() {
        var l = window.location;
        if (l.hash && l.hash.indexOf('#/') === 0) {
          window.history.replaceState(null, '', l.pathname + l.hash.replace(/^#/, ''));
          return;
        }
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(
              null,
              null,
              l.pathname.slice(0, -1) + (q.p || '') + (q.q ? ('?' + q.q) : '') + l.hash
            );
          }
        }
      })();
    </script>

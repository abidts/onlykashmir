s://images.unsplash.com/photo-1626017088971-6a2a5f0d8c97?w=800&q=80"]},pahalgam:{name:"Pahalgam",tagline:"Valley of Shepherds & Sightseeing",image:"https://images.unsplash.com/photo-1564509180796-129e4f4f6de9?auto=format&fit=crop&w=1200&q=80",desc:"Pahalgam sightseeing guide: Betaab Valley, Aru Valley & more!",rating:"4.8",highlight:"Sightseeing Hub",fullDesc:"Pahalgam is a serene valley located in the Anantnag district of Kashmir. Surrounded by snow-capped mountains and lush green forests, it is a perfect destination for nature lovers. The Lidder River flows through the valley, adding to its charm. Pahalgam serves as the base camp for the annual Amarnath Yatra pilgrimage. Top Pahalgam sightseeing places include Betaab Valley, Aru Valley, Chandanwari, and the Baisaran meadows.",bestTime:"April to October",duration:"3-4 Days",activities:["Pahalgam Sightseeing: Betaab Valley","River Rafting on Lidder River","Trekking to Tarsar Lake","Horse Riding in Baisaran","Visit Aru Valley","Visit Chandanwari","Camping by the riverside"],gallery:["https://images.unsplash.com/photo-1600702653377-2bbad1049612?w=800&q=80","https://images.unsplash.com/photo-1595815771614-ade9d652a65d?w=800&q=80","https://images.unsplash.com/photo-1581791534721-e599df4417f6?w=800&q=80"]},sonmarg:{name:"Sonamarg",tagline:"Meadow of Gold & Day Trip",image:"https://images.unsplash.com/photo-1609766857041-ed402ea8069a?w=1200&q=80",desc:"Sonamarg day trip from Srinagar is perfect! Visit Thajiwas Glacier.",rating:"4.9",highlight:"Day Trip Destination",fullDesc:'Sonamarg, meaning "Meadow of Gold", is a picturesque hill station located on the banks of the Sindh River. A Sonamarg day trip from Srinagar is perfect! Surrounded by towering glaciers and snow-capped peaks, it serves as the gateway to Ladakh. The Thajiwas Glacier is a major attraction, accessible by pony ride. Adventure enthusiasts can enjoy trekking to Vishansar Lake, white-water rafting, and camping under the stars.',bestTime:"May to September",duration:"2-3 Days or Sonamarg day trip",activities:["Sonamarg Day Trip from Srinagar","Visit Thajiwas Glacier","Trekking to Vishansar & Krishansar Lakes","White Water Rafting","Camping","Pony Rides"],gallery:["https://images.unsplash.com/photo-1609766857041-ed402ea8069a?w=800&q=80","https://images.unsplash.com/photo-1537126694932-c0f39026528e?w=800&q=80","https://images.unsplash.com/photo-1581791534721-e599df4417f6?w=800&q=80"]},"dal-lake":{name:"Dal Lake",tagline:"Jewel of Srinagar & Houseboats",image:"https://images.unsplash.com/photo-1597074866923-dc0589150bf6?w=1200&q=80",desc:"Dal Lake Srinagar - Book houseboats, enjoy Shikara rides!",rating:"4.9",highlight:"Houseboat Booking",fullDesc:`Dal Lake is the heart and soul of Srinagar, often referred to as the "Jewel in the Crown of Kashmir". We offer Srinagar houseboat booking for all budgets! The lake is famous for its traditional houseboats, colorful Shikaras, and floating vegetable gardens. A stay on a houseboat offers a unique experience of Kashmiri hospitality. The Mughal Gardens on the banks, including Shalimar Bagh and Nishant Bagh, add to the lake's charm.`,bestTime:"April to October",duration:"2-3 Days",activities:["Dal Lake Shikara Ride at Sunrise","Srinagar Houseboat Booking","Stay in a Traditional Houseboat","Visit Floating Market","Explore Mughal Gardens","Photography at Dawn"],gallery:["https://images.unsplash.com/photo-1597074866923-dc0589150bf6?w=800&q=80","https://images.unsplash.com/photo-1595815771614-ade9d652a65d?w=800&q=80","https://images.unsplash.com/photo-1600702653377-2bbad1049612?w=800&q=80"]},"leh-ladakh":{name:"Leh Ladakh",tagline:"Land of High Passes",image:"https://images.unsplash.com/photo-1632979720170-9a1ab1b103d3?auto=format&fit=crop&w=1200&q=80",desc:"Breathtaking moonscapes, ancient monasteries, and the highest motorable passes.",rating:"5.0",highlight:"Adventure Hub",fullDesc:"Leh Ladakh is a high-altitude desert region known for its dramatic landscapes, ancient Buddhist monasteries, and thrilling adventure opportunities. The region boasts some of the world's highest motorable passes including Khardung La and Chang La. Highlights include Pangong Tso Lake, Nubra Valley, Hemis Monastery, and the Magnetic Hill. It's a paradise for bikers, trekkers, and photography enthusiasts.",bestTime:"June to September",duration:"5-7 Days",activities:["Visit Pangong Tso Lake","Explore Nubra Valley","Monastery Tours (Hemis, Thiksey, Diskit)","Motorbike Expedition","River Rafting on Indus"],gallery:["https://images.unsplash.com/photo-1537126694932-c0f39026528e?w=800&q=80","https://images.unsplash.com/photo-1581791534721-e599df4417f6?w=800&q=80","https://images.unsplash.com/photo-1609766857041-ed402ea8069a?w=800&q=80"]},srinagar:{name:"Srinagar",tagline:"City of Gardens",image:"https://images.unsplash.com/photo-1595815771614-ade9d652a65d?w=1200&q=80",desc:"Mughal gardens, historic old city, and the famous handicraft bazaars.",rating:"4.7",highlight:"Heritage City",fullDesc:"Srinagar, the summer capital of Jammu and Kashmir, is a city of timeless beauty nestled in the Kashmir Valley. Known for its Mughal Gardens, serene lakes, and intricate handicrafts, the city exudes old-world charm. The historic old city with its bustling bazaars offers exquisite Pashmina shawls, carpets, and papier-mâché items. Don't miss the iconic Jamia Masjid and Shankaracharya Temple.",bestTime:"March to November",duration:"3-4 Days",activities:["Explore Mughal Gardens","Shop at Lal Chowk Bazaar","Visit Jamia Masjid","Shankaracharya Temple","Try Kashmiri Cuisine"],gallery:["https://images.unsplash.com/photo-1595815771614-ade9d652a65d?w=800&q=80","https://images.unsplash.com/photo-1597074866923-dc0589150bf6?w=800&q=80","https://images.unsplash.com/photo-1600702653377-2bbad1049612?w=800&q=80"]},"manasbal-lake":{name:"Manasbal Lake",tagline:"Lotus Lake of Kashmir",image:"https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=1200&q=80",desc:"Serene freshwater lake famed for lotus blooms and mirrored mountain reflections.",rating:"4.7",highlight:"Hidden Gem",fullDesc:"Manasbal Lake, often called the 'Supreme Gem of Kashmir Lakes', sits north of Srinagar near Safapora. Its clear waters mirror the surrounding Zabarwan hills and apple orchards, while lotus flowers carpet the surface in summer. A calm alternative to Dal, it’s perfect for picnics, birdwatching, and quiet Shikara rides. The nearby Mughal-era Jharokha (Jaroka Bagh) and ancient ruins of Daroga Bagh add heritage charm.",bestTime:"May to October",duration:"1 Day",activities:["Shikara ride among lotus blooms","Birdwatching along the banks","Picnic by the Mughal Jharokha garden","Photography at sunrise and sunset","Combine with Wullar Lake or Nagin Valley visit"],gallery:["https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"]},"sinthon-top":{name:"Sinthon Top",tagline:"360° Panoramic Pass",image:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80",desc:"High-altitude mountain pass linking Kashmir and Kishtwar with sweeping Himalayan views.",rating:"4.6",highlight:"Scenic Drive",fullDesc:"Sinthon Top (also spelled Sinthan) sits around 12,500 ft on the Anantnag–Kishtwar road. The pass offers uninterrupted 360° views of Pir Panjal snowfields, hairpin bends popular with road-trippers, and meadows that stay snow-dusted much of the year. It is less commercialized, making it ideal for photography, quick hikes, and serene picnics above the clouds.",bestTime:"June to September (road accessible)",duration:"Day Trip",activities:["Scenic drive with hairpin bends","Snow play and short ridge walks","Photography at the viewpoint deck","Picnic on the meadows (carry trash back)","Combine with Daksum and Kokernag springs"],gallery:["https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=800&q=80"]},doodhpathri:{name:"Doodhpathri",tagline:"Valley of Milk",image:"https://images.unsplash.com/photo-1489515217757-5fd1be406fef?auto=format&fit=crop&w=1200&q=80",desc:"Alpine meadows with milky-white streams, pine forests, and crowd-free picnic spots.",rating:"4.7",highlight:"Alpine Meadow",fullDesc:"Doodhpathri, about 45 km from Srinagar, is a lush bowl-shaped meadow carpeted with wildflowers and dense pines. The Shaliganga stream froths white against smooth boulders—giving the valley its “milk” name. Cooler and less commercial than Gulmarg, it’s great for day picnics, pony rides, and slow walks along the river.",bestTime:"May to October",duration:"Day Trip",activities:["Riverside picnic by Shaliganga stream","Pony ride across the meadows","Short forest walks and photography","Tea and kulcha at local dhabas","Snow play in early spring/late autumn"],gallery:["https://images.unsplash.com/photo-1489515217757-5fd1be406fef?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"]},"drung-fall":{name:"Drung Waterfall",tagline:"Frozen Cascade",image:"https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1200&q=80",desc:"Dramatic waterfall near Tangmarg that freezes into icicles in winter.",rating:"4.6",highlight:"Winter Marvel",fullDesc:"Drung (Dron) Waterfall sits close to Tangmarg on the way to Gulmarg. In peak winter the cascade turns into a wall of icicles, while summer reveals a thundering flow surrounded by pine forests. It is an easy stop from the Srinagar–Gulmarg highway and pairs well with nearby trout farms and local dhabas.",bestTime:"December to February for frozen view; May to September for flow",duration:"Half Day",activities:["View the frozen waterfall and icicles","Short riverside walk and photography","Tea and kahwa at roadside stalls","Combine with Gulmarg or Tangmarg trout farm","Snow play in winter months"],gallery:["https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80"]},"mughal-gardens":{name:"Mughal Gardens (Srinagar)",tagline:"Nishat • Shalimar • Harwan • Pari Mahal • Cheshma Shahi",image:"https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1200&q=80",desc:"Terraced lawns, fountains, and Chinar-lined vistas along Dal Lake.",rating:"4.8",highlight:"Heritage Gardens",fullDesc:"Srinagar’s Mughal garden circuit strings together Nishat Bagh’s twelve terraces, the royal pavilions of Shalimar, the hillside amphitheater of Harwan, the hilltop viewpoint of Pari Mahal, and the freshwater spring of Cheshma Shahi. Built by the Mughals for leisure and lake views, these gardens showcase Persian-inspired layouts, cascading water channels, and grand Chinars.",bestTime:"April to October (Chinar colors peak in autumn)",duration:"1 Day",activities:["Sunset stroll in Nishat and Shalimar terraces","Panoramic Dal Lake view from Pari Mahal","Spring water tasting at Cheshma Shahi","Picnic on Harwan lawns","Photography of Chinar foliage in autumn"],gallery:["https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80","https://images.unsplash.com/photo-1489515217757-5fd1be406fef?auto=format&fit=crop&w=800&q=80"]},amarnath:{name:"Amarnath Cave",tagline:"Sacred Himalay     <script>
      // Redirect legacy hash routes and normalize GitHub Pages SPA behavior
      (function() {
        var l = window.location;
        if (l.hash && l.hash.indexOf('#/') === 0) {
          window.history.replaceState(null, '', l.pathname + l.hash.replace(/^#/, ''));
          return;
        }
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(
              null,
              null,
              l.pathname.slice(0, -1) + (q.p || '') + (q.q ? ('?' + q.q) : '') + l.hash
            );
          }
        }
      })();

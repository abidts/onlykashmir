<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Only Kashmir Tours and Travels</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <div class="logo">ONLY KASHMIR</div>
                <div class="tagline">Tour & Travels</div>
            </div>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/destinations">Destinations</a></li>
                <li><a href="/packages">Packages</a></li>
                <li><a href="/cabs">Cabs</a></li>
                <li><a href="/hotels">Hotels</a></li>
                <li><a href="/adventure">Adventure</a></li>
                <li><a href="/gallery">Gallery</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero" style="height: 50vh;">
        <div class="hero-slide active">
            <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=1200&q=80" alt="Photo Gallery">
            <div class="hero-content">
                <h1>Photo Gallery</h1>
                <p>Beautiful moments captured in Kashmir</p>
            </div>
        </div>
    </section>

    <section class="packages-section">
        <div class="container">
            <h2>Kashmir Gallery</h2>
            <div class="packages-grid">
                <div class="package-card">
                    <img src="https://res.cloudinary.com/dveg0ai0n/image/upload/v1771416621/gulmarg_wdwcyg.jpg" alt="Gulmarg">
                    <div class="package-content">
                        <h3>Gulmarg</h3>
                    </div>
                </div>
                <div class="package-card">
                    <img src="https://res.cloudinary.com/dveg0ai0n/image/upload/v1771496838/The_beautiful_city_of_Kashmir_acy9cu.jpg" alt="Srinagar">
                    <div class="package-content">
                        <h3>Srinagar</h3>
                    </div>
                </div>
                <div class="package-card">
                    <img src="https://res.cloudinary.com/dveg0ai0n/image/upload/v1771496835/Peaceful_times__xcqpyh.jpg" alt="Dal Lake">
                    <div class="package-content">
                        <h3>Dal Lake</h3>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 Only Kashmir Tour & Travels. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <a href="https://wa.me/918899666998" class="whatsapp-float" target="_blank">
        <span>💬</span>
    </a>

    <script src="/js/main.js"></script>
